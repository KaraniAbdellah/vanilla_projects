<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number Game</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Styling File -->
     <link rel="stylesheet" href="sass/main.css">
</head>
<body>
    
    <div class="page">
        <div class="next_game hidden">
            <p class="message_winner">You Are The Winner</p>
            <button class="next_btn">Next</button>
        </div>
        <header>
            <button class="again">Again!</button>
            <p>&lt;Between 1 and <span class="next_number">20</span>&gt;</p>
        </header>
        <div class="content">
            <h1>Guess My Number ?</h1>
            <div class="guess_number">
                <span class="left"></span>
                <span class="question">?</span>
                <span class="right"></span>
            </div>
        </div>
        <footer>
            <div class="guess">
                <input type="text" class="number">
                <button class="btn_submit">Check!</button>
            </div>
            <div class="main_info">
                <p class="msg">Start Guessing <br> ...</p>
                <p class="score">💯 Score: <span class="number">20</span></p>
                <p class="heigh_score">🏅 Highscore: 
                    <span class="number">0</span>
                    <span class="sperate">--</span>
                    <span class="goal">5</span>
                </p>
            </div>
        </footer>
    </div>
    <script src="main.js"></script>

</body>
</html>
