<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currecy Converter</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SUSE:wght@100..800&display=swap" rel="stylesheet">
    <!-- Styling File -->
    <link rel="stylesheet" href="/sass/page/main.css">
</head>
<body>


    <!-- <dvi class="price">
        <input class="amount" type="text" placeholder="Amount">
        <input type="text" class="from" placeholder="From">
        <input type="text" class="to" placeholder="To">
        <span class="result">0.0</span>
        <button type="submit" class="submit">Convert</button>
    </div> -->

    <div class="page">
        
        <div class="converter">
            <div class="title">Curreny Converter</div>
            <div class="amount">
                <label for="amount">Enter Amount:</label>
                <input id="amount" value="1" type="text" class="amount">
            </div>
            <div class="from_to">
                <div class="text">
                    <p>From</p>
                    <p>To</p>
                </div>
                <div class="currencies">
                    <div class="from">
                        <select class="currencies"></select>
                    </div>
                    <div class="icon">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    </div>
                    <div class="to">
                        <select class="currencies"></select>
                    </div>
                </div>
            </div>
            <p class="result"></p>
            <button class="exchange">Get Exchange Rate</button>
        </div>

    </div>

    <!-- Script File -->
    <script src="main.js"></script>
</body>
</html>
